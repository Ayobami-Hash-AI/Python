<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Rating System</title>

    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .stars {
            font-size: 50px;
            cursor: pointer;
        }

        .star {
            color: gray;
        }

        .star.selected {
            color: gold;
        }

        #rating-message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Star Rating System</h1>

<div class="stars">
    <span class="star" data-value="1">&#9733;</span>
    <span class="star" data-value="2">&#9733;</span>
    <span class="star" data-value="3">&#9733;</span>
    <span class="star" data-value="4">&#9733;</span>
    <span class="star" data-value="5">&#9733;</span>
</div>

<p id="rating-message">No rating selected</p>

<button id="reset">Reset Rating</button>

<script>

    let selectedRating = 0;

    $(document).ready(function () {

        // Hover effect
        $(".star").hover(function () {

            let currentValue = $(this).data("value");

            $(".star").each(function () {

                if ($(this).data("value") <= currentValue) {
                    $(this).addClass("selected");
                } else {
                    $(this).removeClass("selected");
                }

            });

        }, function () {

            $(".star").each(function () {

                if ($(this).data("value") <= selectedRating) {
                    $(this).addClass("selected");
                } else {
                    $(this).removeClass("selected");
                }

            });

        });


        // Click event
        $(".star").click(function () {

            try {

                selectedRating = $(this).data("value");

                $("#rating-message").text("You selected " + selectedRating + " star(s)");

                $(".star").each(function () {

                    if ($(this).data("value") <= selectedRating) {
                        $(this).addClass("selected");
                    } else {
                        $(this).removeClass("selected");
                    }

                });

            } catch (error) {

                $("#rating-message").text("Error selecting rating.");

            }

        });


        // Reset button
        $("#reset").click(function () {

            selectedRating = 0;

            $(".star").removeClass("selected");

            $("#rating-message").text("Rating has been reset.");

        });

    });

</script>

</body>
</html>
